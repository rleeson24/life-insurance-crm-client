name: Deploy client

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      resourceGroup:
        description: Azure resource group name
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: life-insurance-crm-client

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resources
        id: azure
        run: |
          set -euo pipefail
          RG="${{ inputs.resourceGroup }}"
          ENV="${{ inputs.environment }}"
          WEB_APP="bbcrm-${ENV}-web"
          API_APP="bbcrm-${ENV}-api"
          ACR_LOGIN_SERVER="$(az containerapp show --name "$WEB_APP" --resource-group "$RG" --query "properties.configuration.registries[0].server" -o tsv)"
          API_FQDN="$(az containerapp show --name "$API_APP" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)"
          if [ -z "$ACR_LOGIN_SERVER" ] || [ -z "$API_FQDN" ]; then
            echo "Could not read the web Container App registry or API FQDN in $RG. Deploy infrastructure from the API repo first."
            exit 1
          fi
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          echo "web_app=$WEB_APP" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "api_origin=https://${API_FQDN}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${ACR_LOGIN_SERVER}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved web=$WEB_APP API=https://${API_FQDN} ACR=$ACR_NAME"

      - name: Build and push container image
        id: image
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.azure.outputs.acr_name }}"
          docker build \
            -f src/Dockerfile \
            --build-arg VITE_API_BASE_URL="${{ steps.azure.outputs.api_origin }}" \
            --build-arg VITE_AZURE_AD_CLIENT_ID="${{ vars.VITE_AZURE_AD_CLIENT_ID }}" \
            --build-arg VITE_AZURE_AD_TENANT_ID="${{ vars.VITE_AZURE_AD_TENANT_ID }}" \
            --build-arg VITE_AZURE_AD_API_SCOPE="${{ vars.VITE_AZURE_AD_API_SCOPE }}" \
            -t "${{ steps.azure.outputs.image_tag }}" \
            src
          docker push "${{ steps.azure.outputs.image_tag }}"
          IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.azure.outputs.image_tag }}")"
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "docker push did not record an image digest."
            exit 1
          fi
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update web Container App
        run: |
          set -euo pipefail
          echo "Deploying ${{ steps.image.outputs.image_digest }}"
          az containerapp update \
            --name "${{ steps.azure.outputs.web_app }}" \
            --resource-group "${{ inputs.resourceGroup }}" \
            --container-name web \
            --image "${{ steps.image.outputs.image_digest }}" \
            --min-replicas "${{ inputs.environment == 'prod' && 1 || 0 }}"
